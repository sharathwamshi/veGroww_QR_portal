{% extends "base.html" %}
{% block title %}Image QR &mdash; Generate{% endblock %}
{% block content %}

<div class="page-header">
  <div>
    <h1>Generate QR for an Image</h1>
    <p class="subtitle">Upload any image and scanning the QR code will open it directly.</p>
  </div>
  <a href="{{ url_for('image_qr.list_view') }}" class="btn btn-outline">View All</a>
</div>

<div class="panel" style="max-width:560px;">
  <form method="POST" enctype="multipart/form-data">
    <div class="form-group">
      <label for="title">Title (optional)</label>
      <input type="text" id="title" name="title" placeholder="e.g. Event Banner, Product Photo">
    </div>
    <div class="form-group">
      <label for="image">Image File</label>
      <input type="file" id="image" name="image" accept=".png,.jpg,.jpeg,.webp" required>
      <div class="hint">PNG, JPG or WEBP. The QR code links straight to this image.</div>
    </div>
    <button type="submit" class="btn btn-primary">Generate QR Code</button>
  </form>
</div>

{% endblock %}
